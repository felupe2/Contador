<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown GO-LIVE COOAZUL</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
            background-color: transparent;
        }

        .countdown-widget {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #00BFA5 0%, #2196F3 33%, #FFEB3B 66%, #7E57C2 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            color: white;
            border-radius: 15px; 
        }

        .countdown-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .countdown-timer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .countdown-item {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .countdown-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .countdown-value {
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
        }

        .countdown-label {
            font-size: 12px;
            font-weight: bold;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="countdown-widget">
        <div class="countdown-title">GO-LIVE COOAZUL</div>
        <div class="countdown-timer">
            <div class="countdown-item">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">DIAS</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">HORAS</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">MINUTOS</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">SEGUNDOS</div>
            </div>
        </div>
    </div>

    <script>
        // Data configurada para o futuro: 3 de maio de 2027 à meia-noite
        const targetDate = new Date('May 3, 2027 00:00:00').getTime();

        const countdown = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
        }, 1000);
    </script>
</body>
</html>
