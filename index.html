<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Countdowns - COOAZUL, COAGRO e CAMP</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
            background-color: transparent;
        }

        /* Container principal */
        .dashboard-container {
            display: flex;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 15px;
            gap: 25px; /* Espaçamento entre os widgets */
        }

        /* Animação que faz as cores rodarem */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Estrutura de cada Widget individual */
        .countdown-widget {
            flex: 1; 
            height: 100%;
            position: relative; /* Necessário para o efeito de blur atrás */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            color: white;
            border-radius: 15px; 
            
            /* Fundo do próprio widget */
            background: linear-gradient(135deg, #00BFA5, #2196F3, #FFEB3B, #7E57C2);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite; /* 12 segundos para um movimento suave */
            z-index: 1;
        }

        /* O Efeito de Luz / Blur atrás do widget */
        .countdown-widget::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 15px;
            
            /* Mesmo fundo e mesma animação para manter a sincronia perfeita */
            background: linear-gradient(135deg, #00BFA5, #2196F3, #FFEB3B, #7E57C2);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
            
            /* Aqui acontece a mágica da luz */
            filter: blur(15px);
            opacity: 0.8; /* Intensidade do brilho */
            z-index: -1; /* Joga o brilho para trás do widget */
        }

        .countdown-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2); /* Sombra leve para leitura */
        }

        .countdown-timer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 5px;
            box-sizing: border-box;
        }

        .countdown-item {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .countdown-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .countdown-value {
            font-size: 36px; 
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .countdown-label {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="countdown-widget">
            <div class="countdown-title">GO-LIVE COAGRO</div>
            <div class="countdown-timer">
                <div class="countdown-item">
                    <div class="countdown-value" id="coagro-days">00</div>
                    <div class="countdown-label">DIAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="coagro-hours">00</div>
                    <div class="countdown-label">HORAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="coagro-minutes">00</div>
                    <div class="countdown-label">MIN.</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="coagro-seconds">00</div>
                    <div class="countdown-label">SEG.</div>
                </div>
            </div>
        </div>

        <div class="countdown-widget">
            <div class="countdown-title">GO-LIVE CAMP</div>
            <div class="countdown-timer">
                <div class="countdown-item">
                    <div class="countdown-value" id="camp-days">00</div>
                    <div class="countdown-label">DIAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="camp-hours">00</div>
                    <div class="countdown-label">HORAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="camp-minutes">00</div>
                    <div class="countdown-label">MIN.</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="camp-seconds">00</div>
                    <div class="countdown-label">SEG.</div>
                </div>
            </div>
        </div>

        <div class="countdown-widget">
            <div class="countdown-title">GO-LIVE COOAZUL</div>
            <div class="countdown-timer">
                <div class="countdown-item">
                    <div class="countdown-value" id="cooazul-days">00</div>
                    <div class="countdown-label">DIAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cooazul-hours">00</div>
                    <div class="countdown-label">HORAS</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cooazul-minutes">00</div>
                    <div class="countdown-label">MIN.</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cooazul-seconds">00</div>
                    <div class="countdown-label">SEG.</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const targetDates = {
            coagro: new Date('January 4, 2027 00:00:00').getTime(),
            camp: new Date('January 4, 2027 00:00:00').getTime(),
            cooazul: new Date('May 3, 2027 00:00:00').getTime()
        };

        function updateAllCountdowns() {
            const now = new Date().getTime();

            for (const key in targetDates) {
                const distance = targetDates[key] - now;

                const dEl = document.getElementById(`${key}-days`);
                const hEl = document.getElementById(`${key}-hours`);
                const mEl = document.getElementById(`${key}-minutes`);
                const sEl = document.getElementById(`${key}-seconds`);

                if (distance < 0) {
                    if(dEl) dEl.innerText = "00";
                    if(hEl) hEl.innerText = "00";
                    if(mEl) mEl.innerText = "00";
                    if(sEl) sEl.innerText = "00";
                    continue;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if(dEl) dEl.innerText = days < 10 ? '0' + days : days;
                if(hEl) hEl.innerText = hours < 10 ? '0' + hours : hours;
                if(mEl) mEl.innerText = minutes < 10 ? '0' + minutes : minutes;
                if(sEl) sEl.innerText = seconds < 10 ? '0' + seconds : seconds;
            }
        }

        setInterval(updateAllCountdowns, 1000);
        updateAllCountdowns(); 
    </script>
</body>
</html>
